name: lecture-python-programming.zh-cn
repo: ../../../project-translation/repos/lecture-python-programming.zh-cn
files: "lectures/*.md"
source:
  repo: ../../../project-translation/repos/lecture-python-programming
prose: {strategy: script, script: Han, threshold: 0.05}
baseline:
  strategy: state-file
  overrides:
    # shared admonition snippet translated by hand in #23; the engine keeps no
    # state file for it, so the state-file strategy alone reads it as untranslated
    lectures/_admonition/gpu.md: e002d4f
machine:
  bots: ['\[bot\]', 'dependabot', 'github-actions']
  # '^Update translation: ' is the engine's 2026-03/04 per-file commit subject
  # (41 commits, all under the maintainer identity the engine commits as);
  # caught by the 2026-08-28 tier adjudication, where the wave read as ai-assisted
  sync: ['\[translation-sync\]', '\[action-translation\]', 'resync', '^Update translation: ']
  state_dir: .translate/state
disclosure: {trailers: [AI-Assisted], authors: ['copilot-swe-agent']}
people:
  roster: ../../../project-translation/team/reviewers.yml
  roles: {editor: human-editor, translator: human-translator}
