# Per-commit tier overrides for lecture-python.zh-cn — a reviewed data file, not code.
# Applied after the machine and baseline rules (which they cannot reclassify) and before
# the author rules.
#
# These are the probable whole-file AI passes that project-translation's editor-edit-corpus
# plan segregated from the 2025 hand-translation campaign (see QuantEcon/project-translation#22
# and plans/editor-edit-corpus.md: "12 whole-file rewrites in python.zh-cn ... probable further
# AI passes rather than edits"). Candidates were derived by rule — a roster-tier commit
# replacing >=50% of a document's prose lines (measured against the parent revision, renames
# followed) — then each candidate was adjudicated from its before/after pairs. Commits whose
# pairs show a systematic glossary direction, width normalisation or targeted fixes
# (e.g. 1822c976 政策→策略, 806803f8 求职搜索→工作搜寻, 366d271b/151d2c58/b1955d19 蛋糕食用→吃蛋糕)
# were judged genuine human editing and are NOT overridden, so this list is shorter than the
# plan's instance count of 12. Derivation artefacts: the 2026-08-28 scan at 6a4b427.
overrides:
